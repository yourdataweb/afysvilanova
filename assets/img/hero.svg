<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="presentation">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#08202b"/><stop offset="0.55" stop-color="#16404f"/>
      <stop offset="1" stop-color="#2e6b7d"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f5668"/><stop offset="1" stop-color="#08202b"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>

  <!-- window grid, light coming in from the right -->
  <g opacity="0.5">
    <rect x="1010" y="90" width="470" height="520" fill="#9dc0cd" opacity="0.28"/>
    <g stroke="#a7c6d1" stroke-opacity="0.5" stroke-width="6">
      <path d="M1010 90 V610 M1245 90 V610 M1480 90 V610"/>
      <path d="M1010 260 H1480 M1010 435 H1480"/>
    </g>
  </g>
  <rect x="990" y="70" width="510" height="560" fill="none" stroke="#a7c6d1" stroke-opacity="0.35" stroke-width="10"/>

  <!-- desk -->
  <rect x="0" y="700" width="1600" height="300" fill="url(#desk)"/>
  <rect x="0" y="690" width="1600" height="18" fill="#24596b"/>

  <!-- laptop, open, facing viewer-left -->
  <g transform="translate(250 470)">
    <path d="M0 130 L300 130 L330 220 L-30 220 Z" fill="#0b2b38"/>            <!-- base -->
    <path d="M20 130 L280 130 L262 0 L38 0 Z" fill="#123a4a"/>                <!-- screen frame -->
    <path d="M36 16 L264 16 L250 116 L50 116 Z" fill="#e2eef2" opacity="0.92"/><!-- screen -->
    <!-- a chart on the screen -->
    <g fill="#3d8296" opacity="0.85">
      <rect x="66" y="72" width="20" height="34"/><rect x="96" y="58" width="20" height="48"/>
      <rect x="126" y="46" width="20" height="60"/><rect x="156" y="64" width="20" height="42"/>
      <rect x="186" y="38" width="20" height="68"/><rect x="216" y="52" width="20" height="54"/>
    </g>
    <path d="M60 88 L100 74 L140 60 L180 66 L220 40" stroke="#8a5a1c" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- documents stacked, tied to the practice -->
  <g transform="translate(690 560)">
    <g fill="#e2eef2" opacity="0.95">
      <rect x="0" y="60" width="210" height="150" rx="6"/>
      <rect x="14" y="30" width="210" height="150" rx="6" opacity="0.9"/>
      <rect x="30" y="0" width="210" height="150" rx="6"/>
    </g>
    <g stroke="#3d8296" stroke-width="6" stroke-linecap="round" opacity="0.65">
      <path d="M56 34 h150 M56 58 h150 M56 82 h96"/>
      <path d="M40 64 h150 M40 88 h150 M40 112 h96" opacity="0.7"/>
      <path d="M26 94 h150 M26 118 h150 M26 142 h96" opacity="0.55"/>
    </g>
  </g>

  <!-- calculator -->
  <g transform="translate(1050 690)">
    <rect x="0" y="0" width="180" height="120" rx="10" fill="#123a4a"/>
    <rect x="16" y="14" width="148" height="34" rx="4" fill="#a7c6d1" opacity="0.9"/>
    <g fill="#3d8296" opacity="0.85">
      <rect x="16" y="60" width="30" height="22" rx="3"/><rect x="56" y="60" width="30" height="22" rx="3"/>
      <rect x="96" y="60" width="30" height="22" rx="3"/><rect x="136" y="60" width="28" height="22" rx="3"/>
      <rect x="16" y="88" width="30" height="22" rx="3"/><rect x="56" y="88" width="30" height="22" rx="3"/>
      <rect x="96" y="88" width="30" height="22" rx="3"/><rect x="136" y="88" width="28" height="22" rx="3" fill="#8a5a1c"/>
    </g>
  </g>

  <!-- a brass lamp glow to warm the left side -->
  <circle cx="150" cy="560" r="260" fill="#c9944a" opacity="0.12" filter="url(#soft)"/>

  <!-- vertical light shafts -->
  <g opacity="0.10" fill="#e2eef2">
    <path d="M1010 90 L1245 90 L1120 620 L960 620 Z"/>
    <path d="M1245 90 L1480 90 L1420 620 L1290 620 Z"/>
  </g>
</svg>
